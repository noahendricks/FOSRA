# FOSRA Configuration
# Secrets (API keys) are loaded from environment variables, not this file.
[models]
embedding_local = "nomic-ai/nomic-embed-text-v1.5"
embedding_code_local = "nomic-ai/nomic-embed-text-v1.5"
embedding_api = "voyage-code-3"
llm_local = "llama3.1:8b"
llm_api = "claude-sonnet-4-20250514"
reranker = "BAAI/bge-reranker-v2-m3"

[models.ops]
query_expansion = "local"
subagent = "local"
generation = "api"
classifier = "local"
summarization = "local"
code_embedding = "local"

[databases]
postgres_url = "postgresql+asyncpg://localhost:5432/fosra"
qdrant_url = "http://localhost:6333"

[databases.falkordb]
host = "localhost"
port = 6379
graph_name = "fosra"

[ingestion]
chunk_size_parent = 768
chunk_size_child = 192
code_embedding_threshold = 0.4

[retrieval]
initial_summary_top_k = 20
initial_direct_top_k = 10
rerank_top_n = 15
max_iterations = 5
checklist_size = 5

[api]
host = "0.0.0.0"
port = 8000
