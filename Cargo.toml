[workspace]
resolver = "2"
members = [
    "core",
    "server",
    "tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
color-eyre = { version = "0.6.5" }
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
futures = "0.3.32"
inspect = "0.1.0"
log = "0.4.29"
pulldown-cmark = "0.13.3"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
signal-hook = { version = "0.4.4" }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
