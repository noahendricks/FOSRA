[workspace]
resolver = "2"
members = [
    "core",
    "server",
    "tui",
    "agent",
    "storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
color-eyre = { version = "0.6.5" }
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
futures = "0.3.32"
inspect = "0.1.0"
log = "0.4.29"
strum = { version = "0.28.0", features = ["derive"] }
pulldown-cmark = "0.13.3"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
signal-hook = { version = "0.4.4" }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
uuid = { version = "1.16.0", features = ["v7", "serde"] }
postcard = { version = "1.1.1", features = ["alloc"] }
chrono = { version = "0.4.40", features = ["serde"] }
tracing = "0.1.41"
thiserror = "2.0.18"
async-trait = "0.1.88"
rig-core = "0.11.0"
fosra-agent = { path = "agent" }
fosra-storage = { path = "storage" }
sqlx = { version = "0.8.5", features = ["runtime-tokio", "sqlite"] }
surrealdb = { version = "2", features = ["kv-surrealkv"] }
serde_json = "1.0.150"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
